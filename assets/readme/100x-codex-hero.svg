<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">100x for Codex Desktop</title>
  <desc id="desc">对话接入图片与视频生成：对话提需求 ➔ 100x 报价与多模态生成 ➔ 产物回到本地工作区。</desc>

  <!-- 外层底板：浅色纯净底板 #FCFCFB，工控方角边框 -->
  <rect width="1200" height="380" fill="#FCFCFB"/>
  <rect x="1" y="1" width="1198" height="378" stroke="#D6D6D3" stroke-width="2"/>

  <!-- 100x 标志性 Reticle 取景角标 -->
  <g stroke="#2B7FFF" stroke-width="3" stroke-linecap="square">
    <path d="M12 32 V12 H32"/>
    <path d="M1168 12 H1188 V32"/>
    <path d="M12 348 V368 H32"/>
    <path d="M1168 368 H1188 V348"/>
  </g>

  <!-- 左侧品牌与定位 -->
  <g transform="translate(64, 52)">
    <text x="0" y="16" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="1.5">CODEX DESKTOP INTEGRATION</text>

    <!-- 100x 官方品牌标识 (纯正 E1 Exponent 标) -->
    <g transform="translate(0, 48) scale(0.8)">
      <g fill="none" stroke="#171716" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M31 30 39 22v56"/>
        <rect x="55" y="22" width="36" height="56" rx="18"/>
        <rect x="99" y="22" width="36" height="56" rx="18"/>
      </g>
      <g fill="none" stroke="#2B7FFF" stroke-width="5.5" stroke-linecap="square">
        <path d="m143 12 22 22M165 12l-22 22"/>
      </g>
    </g>

    <!-- 标题与副标 -->
    <text x="175" y="102" fill="#171716" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">Codex 创作</text>
    <text x="0" y="182" fill="#171716" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">对话接入图片与视频生成</text>
    <text x="0" y="222" fill="#5A5A56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">提需求 ➔ 查报价 ➔ 生成产物落工作区</text>
  </g>

  <!-- 右侧主视觉：大图形三段式示意 (对话 ➔ 100x ➔ 作品) -->
  <!-- 01 对话提需求 -->
  <g transform="translate(540, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#171716" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">01 DIALOGUE</text>

    <!-- 对话气泡与滑块图形 -->
    <g transform="translate(24, 54)">
      <!-- 气泡 1 -->
      <rect width="128" height="42" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
      <rect x="10" y="12" width="70" height="6" fill="#171716"/>
      <rect x="10" y="24" width="45" height="4" fill="#5A5A56"/>
      <circle cx="108" cy="21" r="5" fill="#2B7FFF"/>

      <!-- 气泡 2 / 预算控制滑块 -->
      <g transform="translate(0, 56)">
        <rect width="128" height="32" fill="#FCFCFB" stroke="#BDBDBB" stroke-width="1"/>
        <line x1="14" y1="16" x2="114" y2="16" stroke="#D6D6D3" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="16" x2="68" y2="16" stroke="#2B7FFF" stroke-width="3" stroke-linecap="round"/>
        <rect x="62" y="9" width="12" height="14" fill="#171716"/>
      </g>
    </g>

    <text x="88" y="188" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">对话提需求</text>
    <text x="88" y="218" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">需求与预算</text>
  </g>

  <!-- 箭头 1 -->
  <g transform="translate(732, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M22 -6 L30 0 L22 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 02 100x 调度网关 -->
  <g transform="translate(778, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">02 100x MCP</text>

    <!-- 100x 核心调度标志与闪电转换图形 -->
    <g transform="translate(48, 54)">
      <rect width="80" height="80" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <path d="M12 22V12h10M68 22V12H58M12 58v10h10M68 58v10H58" stroke="#171716" stroke-width="3" stroke-linecap="square"/>
      <path d="M46 20 32 44h18L36 66" stroke="#2B7FFF" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>

    <text x="88" y="188" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">报价与生成</text>
    <text x="88" y="218" fill="#1A5DCC" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">100x 多模态</text>
  </g>

  <!-- 箭头 2 -->
  <g transform="translate(970, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M22 -6 L30 0 L22 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 03 产物落盘工作区 -->
  <g transform="translate(1016, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#171716" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">03 WORKSPACE</text>

    <!-- 图片与视频产物图形 -->
    <g transform="translate(24, 54)">
      <!-- 图片画幅卡 -->
      <g transform="translate(0, 0)">
        <rect width="58" height="74" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
        <circle cx="20" cy="24" r="5" fill="#2B7FFF"/>
        <path d="M10 56 L24 40 L44 56" stroke="#171716" stroke-width="2" stroke-linecap="square"/>
        <rect x="6" y="62" width="24" height="4" fill="#2B7FFF"/>
      </g>
      <!-- 视频播放卡 -->
      <g transform="translate(70, 0)">
        <rect width="58" height="74" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
        <path d="M24 28 L38 37 L24 46 Z" fill="#2B7FFF"/>
        <line x1="10" y1="58" x2="48" y2="58" stroke="#D6D6D3" stroke-width="2"/>
        <circle cx="28" cy="58" r="3" fill="#171716"/>
      </g>
      <!-- 回到工作区指示条 -->
      <g transform="translate(0, 84)">
        <rect width="128" height="12" fill="#EFEFEC" stroke="#BDBDBB" stroke-width="1"/>
        <path d="M48 6 L64 6 M58 2 L64 6 L58 10" stroke="#2B7FFF" stroke-width="1.5" fill="none"/>
      </g>
    </g>

    <text x="88" y="188" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">产物落工作区</text>
    <text x="88" y="218" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">图片与视频文件</text>
  </g>
</svg>
