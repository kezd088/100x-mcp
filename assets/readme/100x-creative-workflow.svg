<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">100x 创作与交付流水线示意</title>
  <desc id="desc">100x 生成执行流程四个核心阶段：01 查型号规格、02 获取即时报价、03 预算内提交与生成、04 本地落盘交付。</desc>

  <!-- 外层底板：浅色纯净底板 #FCFCFB，工控方角边框 -->
  <rect width="1200" height="260" fill="#FCFCFB"/>
  <rect x="1" y="1" width="1198" height="258" stroke="#D6D6D3" stroke-width="2"/>

  <!-- 100x 标志性 Reticle 取景角标 -->
  <g stroke="#2B7FFF" stroke-width="3" stroke-linecap="square">
    <path d="M12 32 V12 H32"/>
    <path d="M1168 12 H1188 V32"/>
    <path d="M12 228 V248 H32"/>
    <path d="M1168 248 H1188 V228"/>
  </g>

  <!-- 顶栏标题 -->
  <g transform="translate(64, 40)">
    <text x="0" y="0" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="1.5">PIPELINE // 创作生成链路</text>
    <text x="0" y="30" fill="#171716" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">从提示词到本地文件交付</text>
  </g>

  <!-- 阶段 1: 01 查型号 (X: 64) -->
  <g transform="translate(64, 96)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="6" fill="#171716"/>
    <!-- 图形 -->
    <g transform="translate(86, 20)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#171716" stroke-width="2"/>
      <line x1="8" y1="20" x2="36" y2="20" stroke="#5A5A56" stroke-width="2"/>
      <line x1="8" y1="28" x2="22" y2="28" stroke="#2B7FFF" stroke-width="2"/>
      <circle cx="38" cy="28" r="3" fill="#2B7FFF"/>
    </g>
    <text x="110" y="86" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">01 查型号</text>
    <text x="110" y="114" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">确认可用规格</text>
  </g>

  <!-- 箭头 1 (X: 300) -->
  <g transform="translate(300, 162)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 2: 02 查报价 (X: 348) -->
  <g transform="translate(348, 96)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="6" fill="#2B7FFF"/>
    <!-- 图形 -->
    <g transform="translate(86, 20)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <circle cx="24" cy="19" r="12" stroke="#171716" stroke-width="2" fill="none"/>
      <text x="24" y="24" fill="#2B7FFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" text-anchor="middle">$</text>
    </g>
    <text x="110" y="86" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">02 查报价</text>
    <text x="110" y="114" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">获取准确积分</text>
  </g>

  <!-- 箭头 2 (X: 584) -->
  <g transform="translate(584, 162)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 3: 03 预算提交 (X: 632) -->
  <g transform="translate(632, 96)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="6" fill="#171716"/>
    <!-- 图形 -->
    <g transform="translate(86, 20)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <path d="M8 14V8h6M40 14V8H34M8 24v6h6M40 24v6H34" stroke="#171716" stroke-width="2" stroke-linecap="square"/>
      <path d="M28 12 20 23h9L22 34" stroke="#2B7FFF" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="110" y="86" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">03 预算提交</text>
    <text x="110" y="114" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">指定上限扣费</text>
  </g>

  <!-- 箭头 3 (X: 868) -->
  <g transform="translate(868, 162)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 4: 04 本地交付 (X: 916) -->
  <g transform="translate(916, 96)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="6" fill="#2B7FFF"/>
    <!-- 图形 -->
    <g transform="translate(86, 20)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="4" fill="#2B7FFF"/>
      <path d="M10 30 L18 20 L30 30" stroke="#171716" stroke-width="1.5" stroke-linecap="square"/>
      <path d="M34 16 L42 20 L34 24 Z" fill="#2B7FFF"/>
    </g>
    <text x="110" y="86" fill="#171716" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">04 本地交付</text>
    <text x="110" y="114" fill="#5A5A56" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">文件保存工作区</text>
  </g>
</svg>
