<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">100x for Codex Desktop</title>
  <desc id="desc">Create in Codex: Prompt, Create, Save.</desc>

  <!-- 外层底板：浅色纯净底板 #FCFCFB，工控方角边框 -->
  <rect width="1200" height="380" fill="#FCFCFB"/>
  <rect x="1" y="1" width="1198" height="378" stroke="#D6D6D3" stroke-width="2"/>

  <!-- 100x 标志性 Reticle 取景角标 -->
  <g stroke="#2B7FFF" stroke-width="3" stroke-linecap="square">
    <path d="M12 32 V12 H32"/>
    <path d="M1168 12 H1188 V32"/>
    <path d="M12 348 V368 H32"/>
    <path d="M1168 368 H1188 V348"/>
  </g>

  <!-- 左侧品牌与定位 -->
  <g transform="translate(72, 88)">
    <!-- 100x 官方品牌标识 (纯正 E1 Exponent 标) -->
    <g transform="translate(0, 0) scale(0.9)">
      <g fill="none" stroke="#171716" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M31 30 39 22v56"/>
        <rect x="55" y="22" width="36" height="56" rx="18"/>
        <rect x="99" y="22" width="36" height="56" rx="18"/>
      </g>
      <g fill="none" stroke="#2B7FFF" stroke-width="5.5" stroke-linecap="square">
        <path d="m143 12 22 22M165 12l-22 22"/>
      </g>
    </g>

    <!-- 极简标题与副标 -->
    <text x="0" y="128" fill="#171716" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Create in Codex</text>
    <text x="0" y="168" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="3">IMAGE &amp; VIDEO</text>
  </g>

  <!-- 右侧主视觉：大图形三段式示意 (Prompt ➔ Create ➔ Save) -->
  <!-- 01 Prompt -->
  <g transform="translate(540, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#171716" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">01</text>

    <!-- 对话气泡与滑块图形 -->
    <g transform="translate(24, 58)">
      <rect width="128" height="44" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
      <rect x="12" y="13" width="70" height="6" fill="#171716"/>
      <rect x="12" y="25" width="45" height="5" fill="#5A5A56"/>
      <circle cx="108" cy="22" r="5" fill="#2B7FFF"/>

      <g transform="translate(0, 58)">
        <rect width="128" height="32" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1"/>
        <line x1="14" y1="16" x2="114" y2="16" stroke="#D6D6D3" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="16" x2="68" y2="16" stroke="#2B7FFF" stroke-width="3" stroke-linecap="round"/>
        <rect x="62" y="8" width="12" height="16" fill="#171716"/>
      </g>
    </g>

    <text x="88" y="210" fill="#171716" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">Prompt</text>
  </g>

  <!-- 箭头 1 -->
  <g transform="translate(732, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M22 -6 L30 0 L22 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 02 Create -->
  <g transform="translate(778, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">02</text>

    <!-- 100x 引擎取景与闪电图形 -->
    <g transform="translate(44, 56)">
      <rect width="88" height="88" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <path d="M14 24V14h12M74 24V14H62M14 64v10h12M74 64v10H62" stroke="#171716" stroke-width="3" stroke-linecap="square"/>
      <path d="M50 22 36 48h20L40 72" stroke="#2B7FFF" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>

    <text x="88" y="210" fill="#171716" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">Create</text>
  </g>

  <!-- 箭头 2 -->
  <g transform="translate(970, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M22 -6 L30 0 L22 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 03 Save -->
  <g transform="translate(1016, 68)">
    <rect width="176" height="244" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="176" height="34" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="88" y="23" fill="#171716" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">03</text>

    <!-- 图片与视频画幅图形 -->
    <g transform="translate(24, 56)">
      <g transform="translate(0, 0)">
        <rect width="58" height="74" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
        <circle cx="20" cy="24" r="5" fill="#2B7FFF"/>
        <path d="M10 56 L24 40 L44 56" stroke="#171716" stroke-width="2" stroke-linecap="square"/>
        <rect x="6" y="62" width="24" height="4" fill="#2B7FFF"/>
      </g>
      <g transform="translate(70, 0)">
        <rect width="58" height="74" fill="#FCFCFB" stroke="#171716" stroke-width="1.5"/>
        <path d="M24 28 L38 37 L24 46 Z" fill="#2B7FFF"/>
        <line x1="10" y1="58" x2="48" y2="58" stroke="#D6D6D3" stroke-width="2"/>
        <circle cx="28" cy="58" r="3" fill="#171716"/>
      </g>
      <!-- 落盘工作区指示条 -->
      <g transform="translate(0, 84)">
        <rect width="128" height="12" fill="#EFEFEC" stroke="#BDBDBB" stroke-width="1"/>
        <path d="M48 6 L64 6 M58 2 L64 6 L58 10" stroke="#2B7FFF" stroke-width="1.5" fill="none"/>
      </g>
    </g>

    <text x="88" y="210" fill="#171716" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">Save</text>
  </g>
</svg>
