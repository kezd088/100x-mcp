<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">100x Workflow</title>
  <desc id="desc">100x workflow: 01 Choose, 02 Quote, 03 Generate, 04 Save.</desc>

  <!-- 外层底板：浅色纯净底板 #FCFCFB，工控方角边框 -->
  <rect width="1200" height="240" fill="#FCFCFB"/>
  <rect x="1" y="1" width="1198" height="238" stroke="#D6D6D3" stroke-width="2"/>

  <!-- 100x 标志性 Reticle 取景角标 -->
  <g stroke="#2B7FFF" stroke-width="3" stroke-linecap="square">
    <path d="M12 32 V12 H32"/>
    <path d="M1168 12 H1188 V32"/>
    <path d="M12 208 V228 H32"/>
    <path d="M1168 228 H1188 V208"/>
  </g>

  <!-- 顶栏极简标题 -->
  <text x="64" y="44" fill="#1A5DCC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="2">WORKFLOW</text>

  <!-- 阶段 1: 01 Choose (X: 64) -->
  <g transform="translate(64, 72)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="28" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="110" y="19" fill="#171716" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">01</text>
    <!-- 图形 -->
    <g transform="translate(86, 38)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#171716" stroke-width="2"/>
      <line x1="8" y1="20" x2="36" y2="20" stroke="#5A5A56" stroke-width="2"/>
      <line x1="8" y1="28" x2="22" y2="28" stroke="#2B7FFF" stroke-width="2"/>
      <circle cx="38" cy="28" r="3" fill="#2B7FFF"/>
    </g>
    <text x="110" y="112" fill="#171716" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Choose</text>
  </g>

  <!-- 箭头 1 (X: 300) -->
  <g transform="translate(300, 139)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 2: 02 Quote (X: 348) -->
  <g transform="translate(348, 72)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="28" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="110" y="19" fill="#1A5DCC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">02</text>
    <!-- 图形 -->
    <g transform="translate(86, 38)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <circle cx="24" cy="19" r="12" stroke="#171716" stroke-width="2" fill="none"/>
      <text x="24" y="24" fill="#2B7FFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" text-anchor="middle">$</text>
    </g>
    <text x="110" y="112" fill="#171716" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Quote</text>
  </g>

  <!-- 箭头 2 (X: 584) -->
  <g transform="translate(584, 139)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 3: 03 Generate (X: 632) -->
  <g transform="translate(632, 72)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="28" fill="#171716" stroke="#171716" stroke-width="1"/>
    <text x="110" y="19" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">03</text>
    <!-- 图形 -->
    <g transform="translate(86, 38)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <path d="M8 14V8h6M40 14V8H34M8 24v6h6M40 24v6H34" stroke="#171716" stroke-width="2" stroke-linecap="square"/>
      <path d="M28 12 20 23h9L22 34" stroke="#2B7FFF" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="110" y="112" fill="#171716" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Generate</text>
  </g>

  <!-- 箭头 3 (X: 868) -->
  <g transform="translate(868, 139)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square"/>
    <path d="M24 -6 L32 0 L24 6" fill="none" stroke="#2B7FFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- 阶段 4: 04 Save (X: 916) -->
  <g transform="translate(916, 72)">
    <rect width="220" height="134" fill="#FFFFFF" stroke="#D6D6D3" stroke-width="2"/>
    <rect width="220" height="28" fill="#EFEFEC" stroke="#D6D6D3" stroke-width="1"/>
    <text x="110" y="19" fill="#1A5DCC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">04</text>
    <!-- 图形 -->
    <g transform="translate(86, 38)">
      <rect width="48" height="38" fill="#FCFCFB" stroke="#D6D6D3" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="4" fill="#2B7FFF"/>
      <path d="M10 30 L18 20 L30 30" stroke="#171716" stroke-width="1.5" stroke-linecap="square"/>
      <path d="M34 16 L42 20 L34 24 Z" fill="#2B7FFF"/>
    </g>
    <text x="110" y="112" fill="#171716" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Save</text>
  </g>
</svg>
